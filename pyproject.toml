[project]
name = "jelly-plex-sync"
version = "1.0.0"
description = "Stable watch-status and resume-point sync between Plex and Jellyfin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "tenacity>=9.0,<10",
]

[project.scripts]
jelly-plex-sync = "jellyplexsync.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
